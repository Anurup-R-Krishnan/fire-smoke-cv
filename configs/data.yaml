project_root: .
seed: 42

classes:
  0: fire
  1: smoke

# dfire ships as train/ and test/ subdirs; pool both so Data Prep can
# re-split them into train/val/test (70/15/15) with proper stratification.
sources:
  - name: dfire_train
    format: yolo
    images_dir: data/raw/dfire/train/images
    labels_dir: data/raw/dfire/train/labels
    class_map:
      0: 0
      1: 1
    missing_label_is_negative: true

  - name: dfire_test
    format: yolo
    images_dir: data/raw/dfire/test/images
    labels_dir: data/raw/dfire/test/labels
    class_map:
      0: 0
      1: 1
    missing_label_is_negative: true

validation:
  min_width: 32
  min_height: 32
  repair_out_of_bounds_boxes: true
  drop_unknown_classes: true
  drop_tiny_boxes_pixels: 4

deduplication:
  exact_duplicates: true
  perceptual_hash: true
  phash_hamming_threshold: 4

split:
  train: 0.70
  val: 0.15
  test: 0.15
  stratify_by: class_signature

output:
  dataset_dir: data/processed/fire_smoke
  report_dir: reports/data
  transfer_mode: copy
  overwrite: true
  preview_samples: 24
